name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - name: Find service folders with a package.json
        id: find
        run: |
          services=$(for d in services/*/; do
            name=$(basename "$d")
            if [ -f "${d}package.json" ]; then
              echo "$name"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Found services: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: ${{ needs.discover.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Build (if a build script exists)
        working-directory: services/${{ matrix.service }}
        run: npm run build --if-present

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test

      - name: Dependency audit (informational — does not fail the build)
        working-directory: services/${{ matrix.service }}
        run: npm audit --audit-level=high || true
